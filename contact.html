<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/styles/style.css">
    <link rel="stylesheet" href="assets/styles/form.css">
    <link rel="stylesheet" href="assets/styles/mobile.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <title>Contact</title>
</head>
<body>
    <div class="hero-contact">
        <div class="banner">
            <div class="nav">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="portfolio.html">Projects</a></li>
                    <li><a class="current" href="#">Contact</a></li>
                </ul>
            </div>
            <div class="contact-heading">
                <h1 class="heading-contact">Contact me</h1>
            </div>
            <div class="form">
                <form action="">
                    <div class="form-card">
                        <div class="content-form">
                            <div class="form-groups">
                                <label for="name">First Name:</label>
                                <input type="text" name="name" placeholder="Name" required>
                            </div>
                            <div class="form-groups">
                                <label for="name">Last name:</label>
                                <input type="text" name="name" placeholder="Name" required>
                            </div>
                        </div>
                    </div>
                    <div class="form-card">
                        <div class="content-form">
                            <div class="form-groups">
                                <label for="email">Email:</label>
                                <input type="email" name="email" id="" placeholder="email@email.com" required>
                            </div>
                            <div class="form-groups">
                                <label for="fnum">Number:</label>
                                <input type="text" name="fnum" id="" placeholder="+27123456789" required>
                            </div>
                            
                        </div>
                    </div>
                    <div class="form-card">
                        <label for="msg">Message:</label>
                        <textarea name="msg" id="" placeholder="Message" rows="10" cols="90"></textarea>
                    </div>
                    <button class="send">Submit</button>
                </form>
            </div>
        </div>
    </div>
    <div class="footer-container">
        <footer class="footer-items">
            Yusuf Salie - 219273421 - 2026 || This is a demonstration form. Messages are not sent.
        </footer>
    </div>
</body>
</html>
